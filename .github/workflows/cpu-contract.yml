name: CPU contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-light-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      - name: Contracts without optional model runtimes
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_fd_hessian_semantics_streaming.py \
            tests/test_rfo_fd_batch_scope.py \
            tests/test_optional_torch_import.py \
            tests/test_ts_parameter_validation.py \
            tests/test_batch_scan_and_sp.py \
            tests/test_prfo_review_regressions.py \
            tests/test_prfo_rigid_internal.py \
            tests/test_dimer_evaluator_contract.py

  synthetic-torch-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e . pytest
      - name: All tracked CPU regressions (no downloaded model weights)
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m compileall -q maple
          python -m pytest -q tests
