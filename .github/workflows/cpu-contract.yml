name: CPU contract tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-light-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install declared MAPLE dependencies and pytest
        run: python -m pip install -e . pytest
      - name: Run CPU contracts without model weights or FAIR-Chem
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_fd_hessian_semantics_streaming.py \
            tests/test_rfo_fd_batch_scope.py \
            tests/test_optional_torch_import.py
